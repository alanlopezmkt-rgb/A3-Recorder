<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>A3-OS Recorder</title>

    <link rel="stylesheet" href="popup.css">
</head>

<body>

    <div class="container">

        <div class="user-bar">
            <span id="userGreeting"></span>

            <div class="user-bar-right">
                <div id="dbStatus" class="db-status db-status-compact">
                    <span class="db-status-dot" aria-hidden="true"></span>
                    <span id="dbStatusText">Verificando...</span>
                </div>

                <button id="logoutButton" class="logout-button" title="Sair">
                    <svg class="logout-icon" viewBox="0 0 24 24" aria-hidden="true">
                        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
                        <path d="M16 17l5-5-5-5"/>
                        <path d="M21 12H9"/>
                    </svg>
                </button>
            </div>
        </div>

        <header class="header">

            <img
                id="brandIcon"
                class="brand-icon"
                src="../icons/icon-normal-48.png"
                width="46"
                height="46"
                alt=""
            >

            <div class="brand-text">
                <h1>A3-OS Recorder</h1>
                <p class="brand-tagline">Gravação de áudio da aula</p>
            </div>

            <button
                id="themeToggle"
                type="button"
                class="theme-toggle"
                aria-label="Alternar tema claro/escuro"
                title="Alternar tema"
            >
                <svg class="theme-icon theme-icon-sun" viewBox="0 0 24 24" aria-hidden="true">
                    <circle cx="12" cy="12" r="4.2"/>
                    <path d="M12 3v2.3M12 18.7V21M4.9 4.9l1.6 1.6M17.5 17.5l1.6 1.6M3 12h2.3M18.7 12H21M4.9 19.1l1.6-1.6M17.5 6.5l1.6-1.6"/>
                </svg>

                <svg class="theme-icon theme-icon-moon" viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M20 14.5A8.5 8.5 0 1 1 9.5 4a7 7 0 0 0 10.5 10.5z"/>
                </svg>
            </button>

        </header>

        <!-- MODULO -->
        <div class="field">

            <div class="label">
                MÓDULO DETECTADO
            </div>

            <div id="moduleTitle" class="title">
                Detectando...
            </div>

        </div>

        <!-- AULA -->
        <div class="field">

            <div class="label">
                AULA DETECTADA
            </div>

            <div id="title" class="title">
                Detectando...
            </div>

        </div>

        <!-- PROGRESSO DO MODULO ATUAL -->
        <div class="field">

            <div class="progress-summary">

                <div class="progress-summary-item">
                    <div class="progress-summary-top">
                        <span>Progresso geral do curso</span>
                        <span id="overallProgressValue">—</span>
                    </div>
                    <div class="progress-summary-track">
                        <div id="overallProgressFill" class="progress-summary-fill" style="width: 0%"></div>
                    </div>
                </div>

                <div class="progress-summary-item">
                    <div class="progress-summary-top">
                        <span id="moduleProgressLabel">Módulo atual</span>
                        <span id="moduleProgressValue">—</span>
                    </div>
                    <div class="progress-summary-track">
                        <div id="moduleProgressFill" class="progress-summary-fill" style="width: 0%"></div>
                    </div>
                </div>

            </div>

        </div>

        <!-- GRAVAR -->
        <button
            id="recordButton"
            type="button"
            class="record-button"
        >
            <span class="record-icon" aria-hidden="true"></span>
            <span id="recordLabel" class="record-label">GRAVAR</span>
        </button>

        <!-- HISTORICO -->
        <div class="field">

            <button
                id="historyToggle"
                type="button"
                class="history-toggle"
                aria-expanded="false"
            >
                <span>HISTÓRICO DE ENVIOS</span>
                <svg class="history-toggle-chevron" viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M6 9l6 6 6-6"/>
                </svg>
            </button>

            <div id="historyFilters" class="history-filters is-collapsed">
                <button type="button" class="history-filter-btn" data-range="today">Hoje</button>
                <button type="button" class="history-filter-btn" data-range="yesterday">Ontem</button>
                <button type="button" class="history-filter-btn" data-range="week">Semana</button>
                <button type="button" class="history-filter-btn is-active" data-range="all">Tudo</button>
                <input type="date" id="historyDatePicker" class="history-date-picker" />
            </div>

            <div id="historyList" class="history-list is-collapsed">
                <div class="history-empty">Carregando...</div>
            </div>

        </div>

    </div>

    <script src="popup.js"></script>

</body>

</html>
