<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>A3-OS Recorder</title>

    <link rel="stylesheet" href="popup.css">
</head>

<body>

    <div class="container">

        <div class="user-bar">
            <span id="userEmail"></span>
            <button id="logoutButton" title="Sair">Sair</button>
        </div>

        <header class="header">

            <img
                id="brandIcon"
                class="brand-icon"
                src="../icons/icon-normal-48.png"
                width="46"
                height="46"
                alt=""
            >

            <div class="brand-text">
                <h1>A3-OS Recorder</h1>
                <p class="brand-tagline">Gravação de áudio da aula</p>
            </div>

            <button
                id="themeToggle"
                type="button"
                class="theme-toggle"
                aria-label="Alternar tema claro/escuro"
                title="Alternar tema"
            >
                <svg class="theme-icon theme-icon-sun" viewBox="0 0 24 24" aria-hidden="true">
                    <circle cx="12" cy="12" r="4.2"/>
                    <path d="M12 3v2.3M12 18.7V21M4.9 4.9l1.6 1.6M17.5 17.5l1.6 1.6M3 12h2.3M18.7 12H21M4.9 19.1l1.6-1.6M17.5 6.5l1.6-1.6"/>
                </svg>

                <svg class="theme-icon theme-icon-moon" viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M20 14.5A8.5 8.5 0 1 1 9.5 4a7 7 0 0 0 10.5 10.5z"/>
                </svg>
            </button>

        </header>

        <!-- AULA -->
        <div class="field">

            <div class="label">
                AULA DETECTADA
            </div>

            <div id="title" class="title">
                Detectando...
            </div>

        </div>

        <!-- STATUS -->
        <div class="field">

            <div class="label">
                STATUS
            </div>

            <div id="status" class="status">
                <span class="status-dot" aria-hidden="true"></span>
                <span id="statusText" class="status-text">Aguardando...</span>
            </div>

        </div>

        <!-- PASTA -->
        <div class="field">

            <div class="label">
                PASTA DE DESTINO
            </div>

            <div
                id="folder"
                class="folder folder-selectable"
                role="button"
                tabindex="0"
                title="Clique para selecionar a pasta"
            >
                <svg class="folder-icon" viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M3.5 6.2c0-.9.7-1.6 1.6-1.6h4.3c.5 0 1 .2 1.3.6l1 1.1h6.8c.9 0 1.6.7 1.6 1.6v9.3c0 .9-.7 1.6-1.6 1.6H5.1c-.9 0-1.6-.7-1.6-1.6V6.2z"/>
                </svg>

                <span id="folderPath" class="folder-path">
                    Pasta não configurada
                </span>

                <svg class="folder-chevron" viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M9 6l6 6-6 6"/>
                </svg>
            </div>

        </div>

        <!-- GRAVAR -->
        <button
            id="recordButton"
            type="button"
            class="record-button"
        >
            <span class="record-icon" aria-hidden="true"></span>
            <span id="recordLabel" class="record-label">GRAVAR</span>
        </button>

    </div>

    <script src="popup.js"></script>

</body>

</html>
